version: 2
updates:
  # Enable version updates for npm/pnpm dependencies
  # Note: Use "npm" ecosystem - Dependabot detects pnpm from pnpm-lock.yaml
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    # @types/node tracks the published Node.js engines floor, not the development runtime.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Preset 10 requires writer 9; the current release-notes generator uses writer 8.
      # Upgrade this together with semantic-release once its generator supports writer 9.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types: ['version-update:semver-major']
    # Keep major upgrades separate for runtime and published-package compatibility review.
    groups:
      # Group all non-major dev dependencies together
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # Group all non-major production dependencies together
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
