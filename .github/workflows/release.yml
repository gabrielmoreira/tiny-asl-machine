name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next release without creating a tag or draft release
        type: boolean
        default: true
      repair_tag:
        description: Recreate the missing draft release for an orphaned tag, e.g. v2.0.0
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/node.js.yml

  release:
    name: Create verified draft release
    needs: verify
    if: github.repository == 'gabrielmoreira/tiny-asl-machine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up development tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          cache: false
      - name: Install exact consumer Node.js floor
        run: mise install node@22.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare existing release baseline
        run: pnpm run release:baseline
      - name: Check release state
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-guard.mjs
      - name: Wait for the pending draft release
        if: steps.state.outputs.mode == 'pending'
        run: >
          echo "An unpublished draft release for ${{ steps.state.outputs.tag }} exists.
          Publish it before preparing the next release."
      - name: Recreate the orphaned draft release
        if: steps.state.outputs.mode == 'orphan' && inputs.repair_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORPHAN_TAG: ${{ steps.state.outputs.tag }}
          REPAIR_TAG: ${{ inputs.repair_tag }}
        run: |
          if [ "$REPAIR_TAG" != "$ORPHAN_TAG" ]; then
            echo "::error::The orphaned tag is $ORPHAN_TAG, not $REPAIR_TAG"
            exit 1
          fi
          git worktree add --detach .local/repair "$REPAIR_TAG"
          cd .local/repair
          pnpm install --frozen-lockfile
          node scripts/prepare-release.mjs "${REPAIR_TAG#v}"
          gh release create "$REPAIR_TAG" --draft --title "$REPAIR_TAG" --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            ".local/release/tiny-asl-machine-${REPAIR_TAG#v}.tgz#Verified npm package"
      - name: Stop on the orphaned release tag
        if: steps.state.outputs.mode == 'orphan' && inputs.repair_tag == ''
        run: |
          echo "::error::Tag ${{ steps.state.outputs.tag }} has no GitHub Release and no npm version. Rerun this workflow with repair_tag=${{ steps.state.outputs.tag }} to recreate its draft."
          exit 1
      - name: Prepare draft release
        if: steps.state.outputs.mode == 'proceed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ] && [ "$RELEASE_DRY_RUN" = "true" ]; then
            pnpm run release --dry-run
          else
            pnpm run release
          fi
