name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next release without creating a tag or draft release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/node.js.yml

  release:
    name: Create verified draft release
    needs: verify
    if: github.repository == 'gabrielmoreira/tiny-asl-machine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up development tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0
          cache: false
      - name: Install exact consumer Node.js floor
        run: mise install node@22.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare existing release baseline
        run: pnpm run release:baseline
      - name: Prepare draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ] && [ "$RELEASE_DRY_RUN" = "true" ]; then
            pnpm run release --dry-run
          else
            pnpm run release
          fi
